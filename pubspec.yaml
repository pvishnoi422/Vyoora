name: vyoora
description: "Vyoora - AI-powered skincare ingredient analysis app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Image selection & processing
  image_picker: ^1.1.2
  image: ^4.1.0

  # Networking
  http: ^1.4.0
  http_parser: ^4.0.2
  url_launcher: ^6.3.0

  # State management or misc (optional for now)
  flutter_spinkit: ^5.2.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
