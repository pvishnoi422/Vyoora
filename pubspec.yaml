name: vyoora
description: "Vyoora - AI-powered skincare ingredient analysis app"
publish_to: 'none'

version: 1.0.0+16

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Image selection & processing
  image_picker: ^1.1.2
  image: ^4.1.0

  # Networking
  http: ^1.4.0
  http_parser: ^4.0.2
  url_launcher: ^6.3.0

  # Storage
  shared_preferences: ^2.3.2

  # Misc
  flutter_spinkit: ^5.2.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.webp
    - assets/lumi_orb.png

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/icon.webp"
  background_color: "#080808"
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/icon.webp"
